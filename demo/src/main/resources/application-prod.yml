spring:
  application:
    name: datos-prod
  datasource:
    driver-class-name: org.hs.Driver #editar
    url: jdbc:h2:mem:ecommerce #editar
    username: root
    password: 1234
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect